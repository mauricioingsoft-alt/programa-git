<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login y Registro</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor">

        <h1>Sistema de Login y Registro</h1>

        <p class="descripcion">
            Evidencia GA7-220501096-AA5-EV01
        </p>

        <section class="grid">

            <!-- FORMULARIO DE REGISTRO -->

            <div class="card">

                <h2>Registro</h2>

                <form id="registerForm">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                    <label for="registroCorreo">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="registroCorreo"
                        name="correo"
                        required
                    >

                    <label for="registroPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="registroPassword"
                        name="password"
                        required
                    >

                    <button type="submit">
                        Registrarse
                    </button>

                </form>

                <div
                    id="registerMessage"
                    class="message">
                </div>

            </div>


            <!-- FORMULARIO DE LOGIN -->

            <div class="card">

                <h2>Inicio de sesión</h2>

                <form id="loginForm">

                    <label for="loginCorreo">
                        Correo
                    </label>

                    <input
                        type="email"
                        id="loginCorreo"
                        name="correo"
                        required
                    >

                    <label for="loginPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        required
                    >

                    <button type="submit">
                        Iniciar sesión
                    </button>

                </form>

                <div
                    id="loginMessage"
                    class="message">
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
